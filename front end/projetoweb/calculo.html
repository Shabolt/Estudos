<html>
    <header>
        <script src="calculo.js"></script>
        <link rel="stylesheet" href="calculo.css">
    </header>
    <body>
        <h1>Calculadora</h1>
            <p>Digite dois números para realizar a soma: </p>
            <input type="number" id="num1" placeholder="número 1"/>
            <input type="number" id="num2" placeholder="número 2"/>

            <button class="butao" onclick = "somar()"> Somar </button>
            <button class="butao" onclick = "subtrair()"> Subtrair </button>
            <button class="butao" onclick = "dividir()"> Dividir </button>
            <button class="butao" onclick = "multiplicar()"> Multiplicar </button>
        <p id="resultado"></p>
    </body>
</html>
